# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: FAK Docs
site_url: https://fak-docs.krapp.dev
site_description: Documentación del proyecto FAK
site_author: Krapp Ramiro

nav:
  - Inicio: index.md
  - MQTT:
    - Organización Topicos: mqtt/organizacion-topicos.md
    - Conexión al Broker: mqtt/conexion.md
    - ACL: mqtt/acl.md
  - Blog: blog/index.md

theme:
  name: material
  language: es
  palette:
    # toggle para modo claro
    # https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
      primary: indigo
      accent: indigo
    # toggle para modo oscuro
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
      primary: indigo
      accent: indigo
  features:
    # Navegación
    # https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.expand
    - navigation.footer
    - toc.follow
    # Header que se oculta al bajar y reaparece al subir
    # https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-header/
    - header.autohide
    # Búsqueda
    # https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-search/
    - search.suggest
    - search.highlight
    - search.share
    # Contenido
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown/
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

  # https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown-extensions/
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic:
      mode: view
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
      auto_title: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  # https://squidfunk.github.io/mkdocs-material/plugins/search/
  - search
  # https://squidfunk.github.io/mkdocs-material/plugins/tags/
  - tags
  # https://squidfunk.github.io/mkdocs-material/plugins/social/
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-social-cards/
  - social

  # Blog con posts, categorías y archivo
  # https://squidfunk.github.io/mkdocs-material/plugins/blog/
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-a-blog/
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_date_format: yyyy/MM/dd
      post_excerpt: optional
      archive: true
      archive_name: Archivo
      categories: true
      categories_name: Categorías
      pagination_per_page: 10

  # Zoom / lightbox al hacer click en cualquier imagen
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-image-lightboxing/
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

  # https://squidfunk.github.io/mkdocs-material/setup/adding-a-git-repository/
  - git-revision-date-localized:
      enable_creation_date: true

  # Avatar de GitHub de quién editó cada página
  # https://squidfunk.github.io/mkdocs-material/setup/adding-a-git-repository/#document-contributors
  - git-committers:
      repository: KrappRamiro/fak-docs
      branch: main
      token: !ENV [GITHUB_TOKEN]

  - minify:
      minify_html: true

